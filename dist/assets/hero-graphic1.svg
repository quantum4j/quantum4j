<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background gradient -->
  <rect width="900" height="520" rx="32"
        fill="url(#grad-bg)" />

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" x2="900" y1="80" y2="80"/>
    <line x1="0" x2="900" y1="160" y2="160"/>
    <line x1="0" x2="900" y1="240" y2="240"/>
    <line x1="0" x2="900" y1="320" y2="320"/>
    <line x1="0" x2="900" y1="400" y2="400"/>
    <line x1="120" x2="120" y1="0" y2="520"/>
    <line x1="240" x2="240" y1="0" y2="520"/>
    <line x1="360" x2="360" y1="0" y2="520"/>
    <line x1="480" x2="480" y1="0" y2="520"/>
    <line x1="600" x2="600" y1="0" y2="520"/>
    <line x1="720" x2="720" y1="0" y2="520"/>
    <line x1="840" x2="840" y1="0" y2="520"/>
  </g>

  <!-- Soft center glow -->
  <circle cx="450" cy="260" r="160" fill="url(#glow-1)" />
  <circle cx="450" cy="260" r="220" fill="url(#glow-2)" />

  <!-- Quantum4J Orbital Mark (brand icon) -->
  <g transform="translate(450 260)">
    <ellipse rx="110" ry="48"
             stroke="#DDE3FF" stroke-width="6" fill="none"
             opacity="0.92" />
    <ellipse rx="48" ry="110"
             stroke="#DDE3FF" stroke-width="6" fill="none"
             opacity="0.92" />
    <ellipse rx="84" ry="84"
             stroke="#DDE3FF" stroke-width="6" fill="none"
             opacity="0.92" />
  </g>

  <!-- Circuit pulse rings -->
  <circle cx="450" cy="260" r="260"
          stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none" />
  <circle cx="450" cy="260" r="300"
          stroke="rgba(255,255,255,0.025)" stroke-width="2" fill="none" />

  <!-- QASM text (very subtle) -->
  <text x="450" y="440" text-anchor="middle"
        font-size="22" fill="rgba(255,255,255,0.07)"
        font-family="Inter, sans-serif">
    OPENQASM 2.0 • Deterministic Execution • JVM-native
  </text>

  <defs>
    <radialGradient id="grad-bg" cx="0" cy="0" r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(450 260) rotate(90) scale(520 900)">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </radialGradient>

    <radialGradient id="glow-1" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#4C5BFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C5BFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-2" cx="0.5" cy="0.5" r="1.0">
      <stop offset="0" stop-color="#1F2338" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1F2338" stop-opacity="0"/>
    </radialGradient>
  </defs>

</svg>
